spring.application.name=expense-tracker

# --- Database (env-driven; never hardcode credentials) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-this-in-your-env-file-to-a-long-random-string-min-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Gemini ---
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# --- CORS ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.com.expensetracker=INFO
logging.level.org.springframework.security=WARN
